# Interface names only; do not put the management interface here.
DNET2_IFACE_A=ens19
DNET2_IFACE_B=ens20

# Installed BPF objects. Override only for development/testing.
DNET2_RX_OBJECT=/usr/local/lib/dnet2-bpf/dnet2_rx.bpf.o
DNET2_TX_OBJECT=/usr/local/lib/dnet2-bpf/dnet2_tx.bpf.o

# Optional IPv4 virtual adapter over both LANs. Choose a unique host address.
# Empty retains legacy BPF cloning mode; enabling TAP mode bypasses BPF cloning.
DNET2_VIRTUAL_OPTIONS="-v dnet2"
# Override startup address: DNET2_VIRTUAL_OPTIONS="-v dnet2 -a 172.23.1.2/16"
